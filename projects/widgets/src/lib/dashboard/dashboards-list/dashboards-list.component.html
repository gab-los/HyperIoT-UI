<h2 i18n="@@HYT_dashboard_list">Dashboard list</h2>

@if (dashboardList.length === 0) {
<p i18n="@@HYT_no_dashboard_for_user">No dashboards found for this user</p>
}
<ul>
    @for (dashboard of dashboardList; track dashboard) {
        <li><a [routerLink]="['/dashboards', dashboard.id]">
            {{dashboard.name}} ({{dashboard.dashboardType}})
        </a></li>
    }
</ul>
