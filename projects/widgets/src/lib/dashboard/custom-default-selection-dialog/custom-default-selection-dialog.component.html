<div hyt-dialog>
    <div hyt-dialog-header>
        <span i18n="@@HYT_custom_default_selection">Custom Default Slot Selection</span>
    </div>
    <div hyt-dialog-content class="custom-default-selection-dialog">

        <form [formGroup]="customRangeForm">

            <div class="range-selection">

                <div class="time-start">
                    <mat-form-field appearance="fill">
                        <mat-label i18n="@@HYT_start_time">Start Time</mat-label>
                        <input
                            matInput
                            [owlDateTime]="startTimePicker"
                            placeholder="Choose a date"
                            (click)="startTimePicker.open()"
                            formControlName="startTime"
                        />
                        <button mat-icon-button matSuffix type="button" [owlDateTimeTrigger]="startTimePicker">
                            <mat-icon>calendar_today</mat-icon>
                        </button>
                        <owl-date-time #startTimePicker [showSecondsTimer]="true"></owl-date-time>
                    </mat-form-field>
                </div>

                <div class="time-stop">

                    <mat-form-field appearance="fill">
                        <mat-label i18n="@@HYT_end_time">End Time</mat-label>
                        <input
                            matInput
                            [owlDateTime]="endTimePicker"
                            placeholder="Choose a date"
                            (click)="endTimePicker.open()"
                            formControlName="endTime"
                        />
                        <button mat-icon-button matSuffix type="button" [owlDateTimeTrigger]="endTimePicker">
                            <mat-icon>calendar_today</mat-icon>
                        </button>
                        <owl-date-time #endTimePicker [showSecondsTimer]="true"></owl-date-time>
                    </mat-form-field>
                    
                    <mat-checkbox formControlName="endTimeCurrentTime" i18n="@@HYT_end_time_current_time">End Date must be current time</mat-checkbox>

                </div>

            </div>

            @if (customRangeForm.errors?.['timeRangeInvalid'] && customRangeForm.touched) {
            <div class="invalid-range-error" i18n="@@HYT_custom_default_selection_invalid_range">
                End time must be after start time
            </div>
            }

        </form>

    </div>
    <div hyt-dialog-footer>
        <hyt-button [color]="'hyt-base-white'" (clickFn)="cancel()">
            <ng-container i18n="@@HYT_cancel">Cancel</ng-container>
            <span class="hyt-icon icon-hyt_cancel"></span>
        </hyt-button>
        <hyt-button [color]="'hyt-base-white'" (clickFn)="confirm()" [isDisabled]="customRangeForm.invalid">
            <ng-container i18n="@@HYT_area_confirm_btn_confirm">Confirm</ng-container>
            <span class="hyt-icon icon-hyt_arrowRight"></span>
        </hyt-button>
    </div>
</div>
