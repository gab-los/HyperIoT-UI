<hyperiot-base-widget-template>
  <header-widget>
    <hyperiot-common-toolbar
      #toolbar
      widgetName="{{widget.name}}"
      (action)="onToolbarAction($event)"
      [toolbarIsVisible]="isToolbarVisible"
      [config]="{
        showClose: true,
        showSettings: true,
        showPlay: true,
        showRefresh: false,
        showTable: false
      }">
    </hyperiot-common-toolbar>
  </header-widget>

  <content-widget>
    <!-- <ng-container #contentWidget></ng-container> -->

      @if (!isConfigured) {
    <!-- <div *ngIf="!isConfigured; else configured"> -->
      <div class="configure-notice">
        <strong i18n="@@HYT_common_not_configured">Click 'Settings' button to configure.</strong>
      </div>
    <!-- </div> -->
      } @else {
      <div id="modalAnchor"></div>
      <div #bodyMap id="bodyMap" [inlineSVG]="svgImage"></div>
      <div #target>
      </div>
      }

  </content-widget>

</hyperiot-base-widget-template>
