@if (toolbarIsVisible) {
<div class="toolbar-header">
  <div class="toolbar-title">
    <!-- tooltip.hide on mouse down to hide the tooltip when user drags the widget -->
    <span 
      #tooltip="matTooltip"
      [matTooltip]="widgetName"
      matTooltipPosition="above"
      matTooltipClass="hyt-header-tooltip"
      (mousedown)="tooltip.hide()"
    >{{widgetName}}</span>
  </div>
  <div class="toolbar-button">
    @if (config.showPlay) {
    <button (click)="onPlayPause()"
      [attr.disabled]="isDisabled ? true: null">
      <!-- <img *ngIf="!isPaused" i18n-title="@@HYT_toolbar_pause" title="Pause" src="assets/widgets/images/baseline-pause-24px.svg">
        <img *ngIf="isPaused" i18n-title="@@HYT_toolbar_play" title="Play" src="assets/widgets/images/baseline-play_arrow-24px.svg"> -->
      @if (!isPaused) {
      <span class="hyt-icon icon-hyt_pause"></span>
      }
      @if (isPaused) {
      <span class="hyt-icon icon-hyt_play"></span>
      }
    </button>
    }
    @if (config.showTable) {
    <button (click)="onTableView()">
      <!-- <img *ngIf="!showTable" i18n-title="@@HYT_toolbar_table_view" title="Table view" src="assets/widgets/images/outline-view_list-24px.svg">
        <img *ngIf="showTable" i18n-title="@@HYT_toolbar_chart_view" title="Chart view" src="assets/widgets/images/outline-show_chart-24px.svg"> -->
      @if (!showTable) {
      <span class="hyt-icon icon-hyt_tableBig"></span>
      }
      @if (showTable) {
      <span class="hyt-icon icon-hyt_statistics"></span>
      }
    </button>
    }
    @if (config.showRefresh) {
    <button i18n-title="@@HYT_toolbar_refresh" title="Refresh"
      (click)="onRefresh()">
      <!-- <img src="assets/widgets/images/outline-refresh-24px.svg"> -->
      <span class="hyt-icon icon-hyt_statistics"></span>
    </button>
    }
    @if (!config.hideFullScreen) {
    <button class="toolbar-button drag-handle" i18n-title="@@HYT_toolbar_full_screen" title="Full Screen" (click)="onFullScreen()">
      <span class="hyt-icon icon-hyt_plusX"></span>
    </button>
    }
    @if (config.showSettings) {
    <button i18n-title="@@HYT_toolbar_settings" title="Settings"
      (click)="onSettings()">
      <!-- <img src="assets/widgets/images/outline-settings-24px.svg"> -->
      <span class="hyt-icon icon-hyt_setting"></span>
    </button>
    }
    @if (config.showClose) {
    <button i18n-title="@@HYT_toolbar_close" title="Close"
      (click)="onClose()">
      <!-- <img src="assets/widgets/images/outline-close-24px.svg"> -->
      <span class="hyt-icon icon-hyt_cancel"></span>
    </button>
    }
  </div>
</div>
}
