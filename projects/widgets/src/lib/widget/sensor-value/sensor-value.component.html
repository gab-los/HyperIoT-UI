<hyperiot-base-widget-template>

  <header-widget>
    <hyperiot-common-toolbar
      #toolbar
      widgetName="{{widget.name}}"
      (action)="onToolbarAction($event)"
      [toolbarIsVisible]="isToolbarVisible"
      [config]="{
        showClose: true,
        showSettings: true,
        showPlay: serviceType === serviceTypeList.ONLINE,
        showRefresh: false,
        showTable: false,
        hideFullScreen: true
      }">
    </hyperiot-common-toolbar>
  </header-widget>

  <content-widget>

    @if (!isConfigured) {
    <div class="configure-notice">
      <strong i18n="@@HYT_common_not_configured">Click 'Settings' button to configure.</strong>
    </div>
    }

    @if (isConfigured) {
    <div class="sensor-value-container" [ngClass]="widget.config.bgColor">
    
      <div class="value-container">
        @if (canRender(sensorRenderValue)) {
        <span class="sensor-value" [ngStyle]="{'color': widget.config.textColor}">
          {{ sensorRenderValue }}
        </span>
        }
        @if (!canRender(sensorRenderValue)) {
        <span>Waiting for data...</span>
        }
        <div class="timestamp">
          {{ timestamp | amTimeAgo }}
        </div>
      </div>

      <div class="info-container">
        <div class="sensor-field">
          {{ labelSensorField }}
        </div>  
        <div class="activity-led" [ngClass]="{ on: isActivityLedOn }"></div>
      </div>

    </div>
    }

  </content-widget>

</hyperiot-base-widget-template>
