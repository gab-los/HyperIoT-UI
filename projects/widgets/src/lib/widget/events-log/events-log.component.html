<hyperiot-base-widget-template>
    <header-widget>
        <hyperiot-common-toolbar 
            #toolbar
            widgetName="{{widget.name}}" 
            (action)="onToolbarAction($event)"
            [toolbarIsVisible]="isToolbarVisible" 
            [config]="{
                showClose: true,
                showSettings: true,
                showPlay: true,
                showRefresh: false,
                showTable: false
        }">
        </hyperiot-common-toolbar>
    </header-widget>

    <content-widget>

        @if (logMessages.length != 0) {
        <div class="event-log grid">
            @for (log of logMessages; track log) {
                <div class="time">
                    {{log.timestamp.toLocaleTimeString()}}
                </div>
                <div class="message">
                    {{log.message}}
                </div>
                <div class="extra">
                    {{log.extra}}
                </div>
            }
        </div>
        }

        @if (logMessages.length === 0) {
        <div class="log-no-messages">
            <!-- We have no messages to show!! -->
            Waiting for events...
        </div>
        }

    </content-widget>

</hyperiot-base-widget-template>
