<button mat-icon-button class="icon-picker-button" (click)="openIconPickerList()">
  @if (value.includes('fa ') || value.includes('hyt-icon ')) {
  <span [ngClass]="value"></span>
  }
  @if (!value.includes('fa ') && !value.includes('hyt-icon ')) {
  <span class="material-icons">{{value}}</span>
  }
</button>
