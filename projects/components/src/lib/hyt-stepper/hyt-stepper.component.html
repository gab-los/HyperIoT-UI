   <mat-horizontal-stepper 
    #stepper [linear]="isLinear"
    (selectionChange)="change($event)"
   >
    
    @for (template of stepArray; track template; let i = $index) {
    <mat-step

      [completed]="completed[i]"

    >
      <ng-template matStepLabel>

        <div [ngClass]="{'stepIsDirty': isDirty[i], 'stepIsNotDirty': !isDirty[i]}">
          <span class="hyt-icon icon-hyt_warnT"></span>
        </div>

        {{ labelArray[i] }}

      </ng-template>

      <ng-container 
        *ngTemplateOutlet="template">
      </ng-container>

    </mat-step>
    }

  </mat-horizontal-stepper>
