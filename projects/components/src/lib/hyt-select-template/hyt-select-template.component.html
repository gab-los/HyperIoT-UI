
<mat-form-field>

        <mat-label>
          {{ label }}
        </mat-label>

        <mat-select
          [(ngModel)]="value"
          [required]="isRequired"
          [multiple]="isMultiple"
          [name]="name"
          [placeholder]="placeholder"
          [disabled]="disabled"
        >

          @for (group of groups; track group) {
          <mat-optgroup
            [label]="group.name"
            [disabled]="group.disabled"
          >

            @for (option of group.options; track option) {
            <mat-option
              [value]="option.value"
            >
              {{ option.label }}
            </mat-option>
            }

          </mat-optgroup>
          }

          @for (option of options; track option) {
          <mat-option
            [value]="option.value"
          >
            {{ option.label }}
          </mat-option>
          }

        </mat-select>

        <mat-hint>
          {{ hint }}
        </mat-hint>

      </mat-form-field>
