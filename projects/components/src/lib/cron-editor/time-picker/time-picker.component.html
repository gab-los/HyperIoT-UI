<!-- hour -->
<select class="timeFormControl" (change)="change.emit()" [(ngModel)]="time.hours" [disabled]="disabled" [ngClass]="selectClass">
  @for (hour of hours; track hour) {
  <option [ngValue]="hour">{{hour}}</option>
  }
</select>

<!-- minute -->
<select class="timeFormControl" (change)="change.emit()" [(ngModel)]="time.minutes" [disabled]="disabled" [ngClass]="selectClass">
  @for (minute of minutes; track minute) {
  <option [ngValue]="minute">{{minute}}</option>
  }
</select>

<!-- second -->
@if (!hideSeconds) {
<select class="timeFormControl" (change)="change.emit()" [(ngModel)]="time.seconds" [disabled]="disabled"
  [ngClass]="selectClass">
  @for (second of seconds; track second) {
  <option [ngValue]="second">{{second}}</option>
  }
</select>
}

<!-- am/pm -->
@if (!use24HourTime) {
<select class="timeFormControl" (change)="change.emit()" [(ngModel)]="time.hourTypes" [disabled]="disabled"
  [ngClass]="selectClass">
  @for (hourType of hourTypes; track hourType) {
  <option [ngValue]="hourType">{{hourType}}</option>
  }
</select>
}
