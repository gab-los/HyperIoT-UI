<div class="container-dynamic-map">
  @switch (mapType) {
  @case ('LEAFLET') {
  <hyt-leaflet-map #map [editMode]="editMode" [areaConfiguration]="areaConfiguration"></hyt-leaflet-map>
  }
  <!-- Alternatively, here we can provide an alternative type of map such as GOOGLE -->
  @default {
  <hyt-leaflet-map #map [editMode]="editMode" [areaConfiguration]="areaConfiguration">
    <ng-content></ng-content>
  </hyt-leaflet-map>
  }
  }
</div>
