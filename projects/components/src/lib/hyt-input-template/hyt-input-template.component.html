<div class="hyt-form">

    <mat-form-field 
      class="hyt-full-width" 
      [ngClass]="{'errorPositionBottom': errorPosition=='bottom'}"
    >
  
      <mat-label>{{ placeholder }}</mat-label>

      <input matInput #input 
        class="hyt-input form-control" 
        name="{{name}}" 
        id="{{id}}" 
        type="{{type}}"
        value="{{fieldValue}}" 
        (blur)="onBlur()"
        [required]="isRequired"
        [disabled]="isDisabled"
        [pattern]="pattern"
        [(ngModel)]="value"
        [errorStateMatcher]="matcher"
      >
  
      @if (hint) {
      <mat-hint>
        {{ hint }}
      </mat-hint>
      }
  
    </mat-form-field>
  
  </div>
