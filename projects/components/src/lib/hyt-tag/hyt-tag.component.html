<mat-chip
    (click)="click($event)"
    [style.--mdc-chip-elevated-container-color]="color"
    [style.--mdc-chip-label-text-color]="textColor || '#fff'"
>
    {{value}}
    @if (editable) {
    <span class="hyt-icon icon-hyt_pencil" (click)="editedFn($event)"></span>
    }
    @if (removable) {
    <span class="hyt-icon icon-hyt_cancelC" (click)="removedFn($event)"></span>
    }
</mat-chip>
