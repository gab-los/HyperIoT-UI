<div hyt-dialog>
    @if (data?.header) {
    <div hyt-dialog-header>
        <span>{{ data.header }}</span>
    </div>
    }
    <div hyt-dialog-content>
        <span>
            {{ data.text }}
        </span>
    </div>
    <div hyt-dialog-footer>
        <hyt-button [color]="'hyt-base-white'" (clickFn)="close()">
            @if (data.closeButtonLabel) {
            {{ data.closeButtonLabel }}
            }
            @if (!data.closeButtonLabel) {
            <ng-container i18n="@@HYT_ok">OK</ng-container>
            }
        </hyt-button>
    </div>
</div>
