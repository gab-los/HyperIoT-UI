<div class="hyt-form">

  <mat-form-field class="hyt-full-width">

    <mat-label>{{ placeholder }}</mat-label>

    <textarea 
      matInput 
      class="hyt-input" 
      id="{{id}}" 
      value="{{fieldValue}}"
      (focus)="onFocus()"
      (blur)="onBlur()" 
      [formControl]="formControl" 
      [errorStateMatcher]="matcher">
    </textarea>

    @if (hint) {
    <mat-hint 
     >
      {{ hint }}
    </mat-hint>
    }
      
    @if (isRequired && formControl.hasError('required')) {
    <mat-error 
     >
      {{ errMsgRequired }}
    </mat-error>
    }

    @for (error of getDefaultErrorList(); track error) {
    <mat-error>
      {{ error }}
    </mat-error>
    }
  
  </mat-form-field>

</div>
