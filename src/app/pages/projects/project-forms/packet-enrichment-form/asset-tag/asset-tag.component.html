<div *ngIf="tagStatus==0" i18n="@@HYT_loading_data">
  Loading data...
</div>
<div *ngIf="tagStatus==-1" i18n="@@HYT_error_occurred">
  An unexpected error has occurred
</div>
<div *ngIf="tagStatus==1">
  <mat-form-field class="tag-list">
    <mat-label>Tags</mat-label>
    <mat-chip-grid #chipList>
      <mat-chip-row *ngFor="let tag of tags" [removable]="true" (removed)="remove(tag)">
        {{tag.name}}
        <mat-icon matChipRemove>cancel</mat-icon>
      </mat-chip-row>
      <input #tagInput [formControl]="tagCtrl" [matAutocomplete]="auto" [matChipInputFor]="chipList"
        [matChipInputSeparatorKeyCodes]="[13, 188]" [matChipInputAddOnBlur]="false"
        (matChipInputTokenEnd)="add($event)">
    </mat-chip-grid>
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
      <mat-option *ngFor="let tag of filteredTags | async" [value]="tag">
        {{tag.name}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</div>
