<span class="cat-title" i18n="@@HYT_title_categories">Categories</span>

@if (categoryStatus==0) {
<div>
    Loading
    <!--TODO (spinner?)-->
    <!--@I18N@-->
</div>
}

@if (categoryStatus==1) {
<div class="category-tree">
    <hyt-tree-view-category [treeDataFlat]="categoriesFlatTree" mode="packet" [addFunction]="addFunction"
        [removeFunction]="removeFunction" [editFunction]="editFunction" (nodeChecked)="nodeChecked($event)">
    </hyt-tree-view-category>
</div>
}

@if (categoryStatus==-1) {
<div>
    Error loading category data
    <!--TODO-->
    <!--@I18N@-->
</div>
}
